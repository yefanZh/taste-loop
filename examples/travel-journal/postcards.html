<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Postcard Party / Take Me Somewhere</title><style>
:root{--bg:#d8d1fa;--ink:#30266a;--orange:#f6a456;--mint:#a2ebaf;--pink:#f7a8bf}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 system-ui,sans-serif}
nav{padding:24px 5%;display:flex;justify-content:space-between;align-items:center;font-weight:900;gap:15px}nav a{color:inherit}
.hero{padding:34px 5% 110px;max-width:1500px;margin:auto;position:relative;overflow:hidden}
.tag{display:inline-block;background:var(--mint);padding:10px 16px;border:2px solid var(--ink);border-radius:50px;transform:rotate(-4deg);font-weight:900}
h1{font-size:clamp(4rem,12vw,12rem);line-height:.83;letter-spacing:-.1em;text-transform:uppercase;max-width:1100px;margin:32px 0;overflow-wrap:anywhere}
h1 .highlight{color:#f46275;text-shadow:4px 4px 0 var(--ink)}
.deck{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.deck p{max-width:420px;font-size:1.3rem;font-weight:650}
.cta{display:inline-block;background:var(--ink);color:white;padding:18px 26px;transform:rotate(2deg);text-decoration:none;font-weight:850;box-shadow:8px 8px 0 var(--orange)}
.stickers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:80px}
.sticker{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:3px solid var(--ink);font-weight:900;font-size:1.7rem;padding:15px;box-shadow:7px 8px 0 var(--ink)}
.sticker:nth-child(1){background:var(--orange);transform:rotate(-3deg)}.sticker:nth-child(2){background:var(--mint);transform:rotate(2deg)}.sticker:nth-child(3){background:var(--pink);transform:rotate(-2deg)}
.sticker small{font-size:11px;letter-spacing:.2em;margin-top:12px}
@media(max-width:700px){h1{font-size:clamp(3.8rem,17vw,7rem)}.stickers{grid-template-columns:1fr;gap:25px}.hero{padding-bottom:65px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<nav><span>POSTCARD PARTY ✳</span><a href="#souvenirs">OUR STICKERS ↗</a></nav>
<main class="hero"><div class="tag">WISH YOU WERE HERE! ♥</div><h1>TAKE ME<br><span class="highlight">SOMEWHERE.</span></h1>
<div class="deck"><p>Trips, tiny disasters, perfect sunsets. Our unofficial museum of being hopelessly curious together.</p>
<a class="cta" href="#souvenirs">OPEN THE BOX ↗</a></div>
<div class="stickers" id="souvenirs"><div class="sticker">LOST IN PARIS<small>02:40 AM / 2024</small></div>
<div class="sticker">FOUND A LAKE<small>THE LONG WAY ROUND</small></div><div class="sticker">MORE TO COME!<small>STAY TUNED / ∞</small></div></div></main></body></html>
